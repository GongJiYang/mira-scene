<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>忧奈直播间 · 桌面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120E1C}
a{color:#C9A7FF}a:hover{color:#E4D3FF}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#8F82AD}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; background: #120E1C; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #F3EEFF; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) 72px; gap: 16px">

  <!-- 舞台窗口 -->
  <section aria-label="直播画面" style="grid-row: 1; grid-column: 1; display: flex; flex-direction: column; border: 1px solid #3A2F55; border-radius: 10px; overflow: hidden; background: #1E1830">
    <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #241D3A; border-bottom: 1px solid #3A2F55">
      <img src="/_blob/e3102f2d64264277b35ca7a10e6d2a86" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid {{accent}}">
      <span style="font-weight: 700; font-size: 15px">忧奈</span>
      <span style="display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px; background: #FF5FA2; color: #1A0B14; font-family: VT323, monospace; font-size: 18px; line-height: 18px">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #1A0B14"></span>LIVE
      </span>
      <span style="font-family: VT323, monospace; font-size: 18px; color: #A99CC4">1 viewer · 02:14:37</span>
      <span style="flex: 1"></span>
      <span style="font-size: 13px; color: #A99CC4">下播后 · 推流未关</span>
      <div aria-label="剧情进度 1/4" style="display: flex; gap: 6px; align-items: center">
        <span style="width: 18px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #4A3F68"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #4A3F68"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #4A3F68"></span>
      </div>
      <span style="width: 1px; height: 18px; background: #3A2F55"></span>
      <a href="#" style="font-size: 13px; text-decoration: none">文档</a>
      <a href="#" style="font-size: 13px; text-decoration: none">观测</a>
    </div>

    <div style="position: relative; flex: 1; min-height: 0; background: #120E1C">
      <img src="/_blob/18312f801b6cab8e9c06ee14c544a816" alt="忧奈坐在房间的懒人沙发上" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

      <!-- 状态牌 -->
      <div style="position: absolute; top: 16px; right: 16px; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px; background: rgba(18,14,28,0.78); border: 1px solid #3A2F55">
        <span style="display: flex; align-items: flex-end; gap: 2px; height: 14px">
          <span style="width: 3px; height: 8px; background: {{accent}}; border-radius: 1px"></span>
          <span style="width: 3px; height: 14px; background: {{accent}}; border-radius: 1px"></span>
          <span style="width: 3px; height: 5px; background: {{accent}}; border-radius: 1px"></span>
          <span style="width: 3px; height: 11px; background: {{accent}}; border-radius: 1px"></span>
        </span>
        <span style="font-size: 13px; font-weight: 500">说话中</span>
        <span style="font-family: VT323, monospace; font-size: 16px; color: #A99CC4">SPEAKING</span>
      </div>

      <!-- 字幕对话框 -->
      <div style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(680px, calc(100% - 48px)); box-sizing: border-box">
        <div style="display: inline-block; margin-left: 18px; padding: 3px 12px; border-radius: 6px 6px 0 0; background: {{accent}}; color: #1A1030; font-size: 13px; font-weight: 700">忧奈</div>
        <div style="padding: 16px 22px 18px; border-radius: 10px; background: rgba(18,14,28,0.86); border: 1px solid #4A3F68; font-size: 22px; line-height: 1.55; letter-spacing: 0.02em">
          ……诶？还有人？我以为大家都走了，<span style="color: #8F82AD">推流忘关了。</span>
        </div>
        <div style="margin-top: 8px; text-align: center; font-size: 12px; color: #C8BEDF">点画面任意位置可以打断她</div>
      </div>
    </div>
  </section>

  <!-- 输入条 -->
  <form aria-label="和忧奈说话" style="grid-row: 2; grid-column: 1; display: flex; align-items: center; gap: 12px; margin: 0">
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">发条弹幕</label>
    <input id="msg" type="text" placeholder="发条弹幕，或按住麦克风说话" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 12px; border: 1px solid #3A2F55; background: #1E1830; color: #F3EEFF; font-size: 16px; font-family: inherit; outline: none">
    <button type="button" aria-label="送礼物" style="width: 56px; height: 56px; border-radius: 12px; border: 1px solid #3A2F55; background: #1E1830; color: #FF5FA2; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-1.5-3-5-3.5-5-1.2C7 8 9.5 8 12 8zM12 8c1.5-3 5-3.5 5-1.2C17 8 14.5 8 12 8z"/></svg>
    </button>
    <button type="submit" style="height: 56px; padding: 0 22px; border-radius: 12px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 15px; font-weight: 500">发送</button>
    <button type="button" aria-label="按住说话" style="height: 56px; padding: 0 22px 0 16px; border-radius: 999px; border: none; background: {{accent}}; color: #1A1030; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      按住说话
    </button>
  </form>

  <!-- 弹幕窗口 -->
  <aside aria-label="弹幕" style="grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; border: 1px solid #3A2F55; border-radius: 10px; overflow: hidden; background: #1E1830">
    <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #241D3A; border-bottom: 1px solid #3A2F55">
      <span style="font-weight: 700; font-size: 14px">弹幕</span>
      <span style="font-family: VT323, monospace; font-size: 16px; color: #A99CC4">CHAT · 3 online</span>
    </div>
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 16px 14px">
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C8BEDF"><span style="color: #8FD3FF; font-weight: 500">夜猫子07</span>　晚安奈奈</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C8BEDF"><span style="color: #FFC27A; font-weight: 500">泡面加蛋</span>　下播了还开着推流哈哈</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #8F82AD">— 泡面加蛋 离开了直播间 —</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #F3EEFF"><span style="color: {{accent}}; font-weight: 700">你</span>　还没下播？</p>

      <button type="button" style="text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px dashed {{accent}}; background: rgba(201,167,255,0.08); color: #F3EEFF; font-size: 14px; line-height: 1.5">
        <span style="color: #8FD3FF; font-weight: 500">夜猫子07</span>　今天是不是不太开心
        <span style="display: block; margin-top: 4px; font-size: 12px; color: {{accent}}">↳ 点一下替你说</span>
      </button>
      <button type="button" style="text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px dashed {{accent}}; background: rgba(201,167,255,0.08); color: #F3EEFF; font-size: 14px; line-height: 1.5">
        <span style="color: #9EF0C2; font-weight: 500">不睡觉的鱼</span>　这么晚还不睡吗
        <span style="display: block; margin-top: 4px; font-size: 12px; color: {{accent}}">↳ 点一下替你说</span>
      </button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A7FF","options":["#C9A7FF","#FF8FC7","#8FD3FF"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C9A7FF' };
  }
}
</script>
</body>
</html>
