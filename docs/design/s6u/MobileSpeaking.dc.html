<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>忧奈直播间 · 手机说话中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120E1C}
a{color:#C9A7FF}a:hover{color:#E4D3FF}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#8F82AD}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #120E1C; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #F3EEFF">
  <img src="/_blob/556a7c2e2806cd1b4232b4eb204251e9" alt="忧奈坐在房间的懒人沙发上" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top">

  <!-- 顶栏：主播信息 + 剧情进度 -->
  <header style="position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(18,14,28,0.78); border: 1px solid #3A2F55">
        <img src="/_blob/e3102f2d64264277b35ca7a10e6d2a86" alt="" style="width: 32px; height: 32px; border-radius: 50%">
        <div style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 14px; font-weight: 700">忧奈</span>
          <span style="font-family: VT323, monospace; font-size: 14px; color: #A99CC4">1 viewer</span>
        </div>
        <span style="margin-left: 4px; padding: 1px 7px; border-radius: 4px; background: #FF5FA2; color: #1A0B14; font-family: VT323, monospace; font-size: 16px">LIVE</span>
      </div>
      <span style="flex: 1"></span>
      <button type="button" aria-label="菜单" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A2F55; background: rgba(18,14,28,0.78); color: #F3EEFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-radius: 999px; background: rgba(18,14,28,0.7)">
      <span style="font-size: 12px; color: #E4DCF5">下播后 · 推流未关</span>
      <span aria-label="剧情进度 1/4" style="display: flex; gap: 4px; align-items: center">
        <span style="width: 14px; height: 5px; border-radius: 3px; background: {{accent}}"></span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: #6A5C8E"></span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: #6A5C8E"></span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: #6A5C8E"></span>
      </span>
    </div>
  </header>

  <!-- 状态牌 -->
  <div style="position: absolute; top: 120px; right: 12px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(18,14,28,0.78); border: 1px solid #3A2F55">
    <span style="display: flex; align-items: flex-end; gap: 2px; height: 12px">
      <span style="width: 2px; height: 7px; background: {{accent}}"></span>
      <span style="width: 2px; height: 12px; background: {{accent}}"></span>
      <span style="width: 2px; height: 4px; background: {{accent}}"></span>
      <span style="width: 2px; height: 9px; background: {{accent}}"></span>
    </span>
    <span style="font-size: 12px; font-weight: 500">说话中</span>
  </div>

  <!-- 弹幕 + 引导 -->
  <div style="position: absolute; left: 12px; right: 96px; bottom: 236px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
    <p style="margin: 0; padding: 4px 10px; border-radius: 8px; background: rgba(18,14,28,0.6); font-size: 13px; color: #E4DCF5"><span style="color: #8FD3FF; font-weight: 500">夜猫子07</span>　晚安奈奈</p>
    <p style="margin: 0; padding: 4px 10px; border-radius: 8px; background: rgba(18,14,28,0.6); font-size: 13px; color: #F3EEFF"><span style="color: {{accent}}; font-weight: 700">你</span>　还没下播？</p>
    <button type="button" style="text-align: left; padding: 6px 10px; border-radius: 8px; border: 1px dashed {{accent}}; background: rgba(18,14,28,0.78); color: #F3EEFF; font-size: 13px; line-height: 1.45">
      <span style="color: #9EF0C2; font-weight: 500">不睡觉的鱼</span>　今天是不是不太开心
      <span style="display: block; font-size: 11px; color: {{accent}}">↳ 点一下替你说</span>
    </button>
  </div>

  <!-- 字幕 -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: 96px">
    <div style="display: inline-block; margin-left: 12px; padding: 2px 10px; border-radius: 6px 6px 0 0; background: {{accent}}; color: #1A1030; font-size: 12px; font-weight: 700">忧奈</div>
    <div style="padding: 12px 16px 14px; border-radius: 10px; background: rgba(18,14,28,0.88); border: 1px solid #4A3F68; font-size: 18px; line-height: 1.55">
      ……诶？还有人？<span style="color: #8F82AD">推流忘关了。</span>
    </div>
  </div>

  <!-- 输入条 -->
  <form aria-label="和忧奈说话" style="position: absolute; left: 12px; right: 12px; bottom: 24px; display: flex; align-items: center; gap: 8px; margin: 0">
    <label for="m1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">发条弹幕</label>
    <input id="m1" type="text" placeholder="发条弹幕，或按住麦克风说话" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid #4A3F68; background: rgba(18,14,28,0.86); color: #F3EEFF; font-size: 15px; font-family: inherit; outline: none">
    <button type="button" aria-label="送礼物" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; border: 1px solid #4A3F68; background: rgba(18,14,28,0.86); color: #FF5FA2; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-1.5-3-5-3.5-5-1.2C7 8 9.5 8 12 8zM12 8c1.5-3 5-3.5 5-1.2C17 8 14.5 8 12 8z"/></svg>
    </button>
    <button type="button" aria-label="按住说话" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%; border: none; background: {{accent}}; color: #1A1030; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A7FF","options":["#C9A7FF","#FF8FC7","#8FD3FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C9A7FF' };
  }
}
</script>
</body>
</html>
