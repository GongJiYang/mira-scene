<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>动作表面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120E1C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<aside aria-label="弹幕与动作表" style="width: 380px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid #3A2F55; border-radius: 10px; overflow: hidden; background: #1E1830; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #F3EEFF">
  <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #241D3A; border-bottom: 1px solid #3A2F55">
    <span style="font-weight: 700; font-size: 14px">弹幕</span>
    <span style="font-family: VT323, monospace; font-size: 16px; color: #A99CC4">CHAT · 3 online</span>
  </div>

  <!-- 动作表：展开态 -->
  <section aria-label="动作表" style="flex-shrink: 0; border-bottom: 1px solid #3A2F55; background: #1A1529">
    <button type="button" aria-expanded="true" style="width: 100%; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: none; background: transparent; color: #F3EEFF; font-size: 13px; font-weight: 500">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6"/></svg>
      动作表
      <span style="font-size: 12px; color: #A99CC4">点一下，她就做一遍</span>
      <span style="flex: 1"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A99CC4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #A99CC4">情绪</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 13px">平静</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 13px">防备</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 13px">难过</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{accent}}; background: rgba(201,167,255,0.16); color: #F3EEFF; font-size: 13px">温暖 · 3s</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 13px">惊讶</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 13px">中性</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #A99CC4">表情</span>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">爱心眼</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">飘爱心</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">脸红</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">惊讶</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">哭</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">生气</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">脸黑</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">黑眼圈</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">飞头</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">飞宠</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #A99CC4">动作</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">喝一口</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">瞄弹幕</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">看手机</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">抱熊</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">挥手</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">摇尾巴</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">抖耳朵</button>
          <button type="button" style="height: 32px; border-radius: 8px; border: 1px solid #3A2F55; background: #241D3A; color: #F3EEFF; font-size: 12px">身体晃</button>
        </div>
      </div>
      <p style="margin: 0; font-size: 12px; color: #A99CC4">只在你这里预览，不会算作对话。她说话时按钮会暂时变灰。</p>
    </div>
  </section>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 16px 14px">
    <p style="margin: 0; font-size: 14px; color: #C8BEDF"><span style="color: #8FD3FF; font-weight: 500">夜猫子07</span>　晚安奈奈</p>
    <p style="margin: 0; font-size: 14px; color: #F3EEFF"><span style="color: {{accent}}; font-weight: 700">你</span>　还没下播？</p>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A7FF","options":["#C9A7FF","#FF8FC7","#8FD3FF"]},"$preview":{"width":380,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C9A7FF' };
  }
}
</script>
</body>
</html>
