<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120E1C}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#8F82AD}
</style>
</helmet>
<div style="width: 600px; height: 820px; box-sizing: border-box; padding: 20px; background: rgba(18,14,28,0.9); font-family: 'Noto Sans SC', system-ui, sans-serif; color: #F3EEFF">
  <section role="dialog" aria-label="设置" style="display: flex; flex-direction: column; border: 1px solid #3A2F55; border-radius: 10px; overflow: hidden; background: #1E1830">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #241D3A; border-bottom: 1px solid #3A2F55">
      <span style="font-weight: 700; font-size: 15px">设置</span>
      <button type="button" aria-label="关闭" style="width: 32px; height: 32px; border: none; background: transparent; color: #A99CC4; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px; padding: 18px 20px 20px">
      <!-- 模式 -->
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #A99CC4">模式</span>
        <div role="radiogroup" aria-label="模式" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 3px; border-radius: 10px; background: #120E1C; border: 1px solid #3A2F55">
          <button type="button" role="radio" aria-checked="true" style="height: 36px; border-radius: 8px; border: none; background: {{accent}}; color: #1A1030; font-size: 14px; font-weight: 700">自动</button>
          <button type="button" role="radio" aria-checked="false" style="height: 36px; border-radius: 8px; border: none; background: transparent; color: #C8BEDF; font-size: 14px">Mock</button>
          <button type="button" role="radio" aria-checked="false" style="height: 36px; border-radius: 8px; border: none; background: transparent; color: #C8BEDF; font-size: 14px">真实</button>
        </div>
        <span style="font-size: 12px; color: #A99CC4">自动：有聊天和语音的 Key 就用真实模型，否则用 Mock。当前：<span style="color: {{accent}}">真实</span></span>
      </div>

      <!-- 聊天 -->
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 14px; font-weight: 500">聊天</span>
          <span style="font-size: 12px; color: #A99CC4">DeepSeek</span>
          <span style="flex: 1"></span>
          <span style="padding: 2px 8px; border-radius: 999px; background: rgba(158,240,194,0.12); color: #9EF0C2; font-size: 12px">服务器已配置</span>
        </div>
        <label for="k-llm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">DeepSeek API Key</label>
        <input id="k-llm" type="password" placeholder="填你自己的 API Key（可留空）" style="height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A2F55; background: #120E1C; color: #F3EEFF; font-size: 14px; font-family: inherit">
      </div>

      <!-- 语音 -->
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 14px; font-weight: 500">语音</span>
          <span style="font-size: 12px; color: #A99CC4">Fish Audio</span>
          <span style="flex: 1"></span>
          <span style="padding: 2px 8px; border-radius: 999px; background: rgba(201,167,255,0.14); color: {{accent}}; font-size: 12px">使用你填的</span>
        </div>
        <label for="k-voice" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Fish API Key</label>
        <input id="k-voice" type="password" value="••••••••••••••••" style="height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid {{accent}}; background: #120E1C; color: #F3EEFF; font-size: 14px; font-family: inherit">
        <label for="k-voice-id" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">音色 ID</label>
        <input id="k-voice-id" type="text" placeholder="音色 ID（可选，留空用忧奈的音色）" style="height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A2F55; background: #120E1C; color: #F3EEFF; font-size: 14px; font-family: inherit">
      </div>

      <!-- 生图 -->
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 14px; font-weight: 500">生图</span>
          <span style="font-size: 12px; color: #A99CC4">OpenAI 兼容</span>
          <span style="flex: 1"></span>
          <span style="padding: 2px 8px; border-radius: 999px; background: rgba(255,194,122,0.12); color: #FFC27A; font-size: 12px">未配置 · 换背景用示例图</span>
        </div>
        <label for="k-img" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">生图 API Key</label>
        <input id="k-img" type="password" placeholder="API Key" style="height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A2F55; background: #120E1C; color: #F3EEFF; font-size: 14px; font-family: inherit">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <label for="k-img-url" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Base URL</label>
          <input id="k-img-url" type="text" placeholder="Base URL" style="height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A2F55; background: #120E1C; color: #F3EEFF; font-size: 14px; font-family: inherit; min-width: 0">
          <label for="k-img-model" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">模型</label>
          <input id="k-img-model" type="text" placeholder="模型（可选）" style="height: 42px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3A2F55; background: #120E1C; color: #F3EEFF; font-size: 14px; font-family: inherit; min-width: 0">
        </div>
      </div>

      <p style="margin: 0; padding: 10px 12px; border-radius: 8px; background: #120E1C; font-size: 12px; line-height: 1.6; color: #C8BEDF">Key 只保存在这台设备的浏览器里，每次连接时发给服务器使用，服务器不保存。</p>

      <div style="display: flex; gap: 10px">
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #3A2F55; background: transparent; color: #C8BEDF; font-size: 14px">清除我的 Key</button>
        <span style="flex: 1"></span>
        <button type="button" style="height: 44px; padding: 0 22px; border-radius: 10px; border: none; background: {{accent}}; color: #1A1030; font-size: 14px; font-weight: 700">保存并重新连接</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A7FF","options":["#C9A7FF","#FF8FC7","#8FD3FF"]},"$preview":{"width":600,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C9A7FF' };
  }
}
</script>
</body>
</html>
